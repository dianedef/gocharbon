name: Flutter CI

on:
  pull_request:
    paths:
      - "flutter_app/**"
      - "scripts/vercel_build_flutter.sh"
      - "vercel.json"
      - ".github/workflows/flutter_ci.yml"
  push:
    branches: ["main"]
    tags: ["v*"]
    paths:
      - "flutter_app/**"
      - "scripts/vercel_build_flutter.sh"
      - "vercel.json"
      - ".github/workflows/flutter_ci.yml"
  workflow_dispatch: {}

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
          channel: "stable"
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  web_vercel_build:
    runs-on: ubuntu-latest
    needs: [checks]
    steps:
      - uses: actions/checkout@v4

      - name: Cache Vercel build caches
        uses: actions/cache@v4
        with:
          path: .vercel/cache
          key: vercel-flutter-${{ hashFiles('scripts/vercel_build_flutter.sh', 'flutter_app/pubspec.lock') }}
          restore-keys: vercel-flutter-

      - name: Build Web (Vercel script)
        run: bash scripts/vercel_build_flutter.sh
        env:
          RUN_CHECKS: "0"
          API_BASE_URL: ${{ secrets.API_BASE_URL || 'http://localhost:3001' }}
          VERCEL_ENV: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && 'production' || 'preview' }}
          ENABLE_SOURCE_MAPS: ${{ github.event_name == 'pull_request' && '1' || '0' }}

  android_debug:
    runs-on: ubuntu-latest
    needs: [checks]
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
          channel: "stable"
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('flutter_app/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Pub get
        run: flutter pub get

      - name: Build APK (debug)
        run: flutter build apk --debug --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL || 'http://localhost:3001' }}

  android_release:
    runs-on: ubuntu-latest
    needs: [checks]
    if: startsWith(github.ref, 'refs/tags/v')
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
          channel: "stable"
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('flutter_app/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Pub get
        run: flutter pub get

      - name: Build APK (release)
        run: flutter build apk --release --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL || 'http://localhost:3001' }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
