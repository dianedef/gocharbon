<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="GoCharbon Business Quizz: un quiz business gamifié pour tester vos connaissances.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="GoCharbon Quiz">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>GoCharbon Business Quizz</title>
  <link rel="manifest" href="manifest.json">
  <script>
    (function () {
      function normalizeLocale(value) {
        if (typeof value !== "string") return null;
        const trimmed = value.trim();
        if (!trimmed) return null;
        const normalized = trimmed.split("@")[0].replace(/_/g, "-");
        try {
          new Intl.Locale(normalized);
          return normalized;
        } catch (_) {
          return null;
        }
      }

      const originalLanguages = Array.isArray(navigator.languages) ? navigator.languages : [];
      const primaryLocale = normalizeLocale(navigator.language) || "en-US";
      const sanitizedLanguages = originalLanguages
        .map(normalizeLocale)
        .filter(Boolean);
      const locales = Array.from(new Set([primaryLocale, ...sanitizedLanguages]));

      try {
        Object.defineProperty(navigator, "language", {
          configurable: true,
          get: function () {
            return primaryLocale;
          },
        });
        Object.defineProperty(navigator, "languages", {
          configurable: true,
          get: function () {
            return locales;
          },
        });
      } catch (_) {
        // Ignore if the browser prevents overriding navigator locale fields.
      }
    })();
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
